
services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka

    networks:
      - kafka-network

    ports:
      - 9092:9092

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'

      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'

      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'

      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'

      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  kafka-init:
    image: apache/kafka:latest
    
    entrypoint: ["/bin/bash", "/init.sh"]

    volumes:
      - ./kafka/init.sh:/init.sh:ro

    networks:
      - kafka-network

    environment:
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092

    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy


  consumer-service:
    build:
      context: ../../src/
      dockerfile: Central/Consumer/Dockerfile

    networks:
      - kafka-network

    environment:
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__ConsumerGroupId=test-consumers

    depends_on:
      kafka-init:
        condition: service_completed_successfully

  producer-service: #TODO: move to edge cluster
    build:
      context: ../../src/
      dockerfile: Edge/Producer/Dockerfile

    networks:
      - kafka-network

    environment:
      - Kafka__BootstrapServers=kafka:9092
    
    depends_on:
      kafka-init:
        condition: service_completed_successfully


networks:
  kafka-network:
    driver: bridge